org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# Built-in Kotlin is on since Flutter 3.50 (supported from 3.47). On 3.44 it had
# to stay off: AGP refused any module that still applied the Kotlin Gradle
# plugin. Every plugin here now switches to built-in Kotlin when this is true;
# with it false, flutter_image_compress_common falls back to KGP and Flutter
# warns that such plugins will stop building.
#
# When adding a plugin, read its android/build.gradle first: one that still
# applies KGP unconditionally breaks the build with this on, and that is the
# signal to pick another, not to turn this off.
android.builtInKotlin=true
# On since Flutter 3.50, whose Gradle plugin was rewritten against AGP 9's
# public API. With 3.44 the plugin failed outright on it ("Starting AGP 9+,
# only the new DSL interface will be read...").
android.newDsl=true
