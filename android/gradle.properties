org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# Both flags were added by the Flutter template, and both have to stay off on
# this Flutter version (3.44.4) even though the project builds with AGP 9.
#
# Turning them on was tried on 2026-08-03 and does not work yet: with
# builtInKotlin=true AGP refuses any module that still applies the Kotlin
# Gradle plugin, and with newDsl=true the Flutter Gradle plugin itself fails —
# "Starting AGP 9+, only the new DSL interface will be read... update flutter
# or opt out of android.newDsl".
#
# The consequence to remember when adding a plugin: one whose Gradle script
# skips applying KGP on AGP 9 (file_picker does) never gets its Kotlin
# compiled, and the build dies on "cannot find symbol" in the generated
# registrant. Prefer plugins written for both paths.
android.newDsl=false
android.builtInKotlin=false
