name: dvir
description: "Dvir - community management app for OSBB, cooperatives and local communities"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  supabase_flutter: ^2.15.4
  # Declared explicitly, though it arrives with supabase: PostgREST lets the
  # HTTP client's exceptions through untouched, so the data layer has to name
  # ClientException to tell "no connection" from "unexpected error".
  http: ^1.6.0
  # Arrives with supabase, declared because the app generates ids itself: a
  # document's storage key is its row id, so the id exists before either write.
  uuid: ^4.5.1
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  logger: ^2.7.0
  flutter_secure_storage: ^10.3.1
  share_plus: ^13.2.1
  # Arrives with supabase (it opens the auth callback), declared because the
  # contacts list dials a `tel:` link — see core/utils/phone.dart and the
  # <queries> block in AndroidManifest.xml that lets it see a dialler at all.
  url_launcher: ^6.3.2
  # file_selector rather than file_picker, for two reasons found the hard way:
  # file_picker's Gradle script skips the Kotlin plugin on AGP 9, so its own
  # plugin class never compiles and the Android build dies (see
  # android/gradle.properties), and it pins win32 ^5 while share_plus 13 needs
  # ^6 — which pub solves globally, though no Windows build exists here.
  # file_selector is Flutter's own, needs no win32, and builds as it is.
  file_selector: ^1.1.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  mime: ^2.0.0
  drift: ^2.34.3
  path: ^1.9.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Arrives with flutter_test, but the toast timer tests name it directly.
  fake_async: ^1.3.3
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  flutter_gen_runner: ^5.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  drift_dev: ^2.34.0

# Launcher icons, generated from tool/branding/ (sources live outside assets/ so
# they are not bundled). Regenerate with:
#   fvm dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: tool/branding/app_icon.png
  # The adaptive layers are separate because Android masks them to the device's
  # shape: the foreground is inset so no mask can clip the mark, and the
  # background is a flat brand fill rather than an image.
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: tool/branding/adaptive_foreground.png
  # Android 13+ themed icons: the system tints this silhouette itself.
  adaptive_icon_monochrome: tool/branding/adaptive_monochrome.png
  # App Store rejects an icon with an alpha channel; the source is already
  # opaque, this is the belt-and-braces.
  remove_alpha_ios: true
  min_sdk_android: 21

# Native launch screen, so the cold start does not flash white before Flutter
# paints its own SplashScreen. Regenerate with:
#   fvm dart run flutter_native_splash:create
flutter_native_splash:
  android: true
  ios: true
  web: false
  # The scheme's surface, matching what DvScaffold paints underneath the Flutter
  # splash, so the handover is a swap of contents rather than of background.
  color: "#F4FBF8"
  color_dark: "#0E1513"
  # The DvAppMark tile at 72dp (supplied at 4x), not the bare glyph: the glyph
  # is white and would vanish on the light surface.
  image: tool/branding/splash_tile.png
  image_dark: tool/branding/splash_tile.png
  android_12:
    # Android 12+ ignores the legacy window background: it masks the image into
    # a circle and paints icon_background_color behind it, so here the tile is
    # split back into a plain glyph over a brand fill.
    color: "#F4FBF8"
    color_dark: "#0E1513"
    image: tool/branding/splash_android12.png
    image_dark: tool/branding/splash_android12.png
    icon_background_color: "#0D9488"
    icon_background_color_dark: "#0D9488"

# Typed asset references generated into lib/gen/ (e.g. Assets.images.authBackground).
flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true

  # Generate localizations (see l10n.yaml) into lib/l10n/.
  generate: true

  # Bundled assets. .env holds Supabase URL + anon key (not committed).
  assets:
    - .env
    - assets/images/
    - assets/icons/

  # Inter as a single variable file: one asset covers every weight (Thin→Black)
  # via the `wght` axis, so `fontWeight` in the text theme just works. Bundled
  # rather than fetched at runtime — no network dependency on first launch.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
