name: dvir
description: "Dvir - community management app for OSBB, cooperatives and local communities"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  supabase_flutter: ^2.15.4
  # Declared explicitly, though it arrives with supabase: PostgREST lets the
  # HTTP client's exceptions through untouched, so the data layer has to name
  # ClientException to tell "no connection" from "unexpected error".
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  logger: ^2.7.0
  flutter_secure_storage: ^10.3.1
  share_plus: ^13.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Arrives with flutter_test, but the toast timer tests name it directly.
  fake_async: ^1.3.3
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  flutter_gen_runner: ^5.14.1

# Typed asset references generated into lib/gen/ (e.g. Assets.images.authBackground).
flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true

  # Generate localizations (see l10n.yaml) into lib/l10n/.
  generate: true

  # Bundled assets. .env holds Supabase URL + anon key (not committed).
  assets:
    - .env
    - assets/images/
    - assets/icons/

  # Inter as a single variable file: one asset covers every weight (Thin→Black)
  # via the `wght` axis, so `fontWeight` in the text theme just works. Bundled
  # rather than fetched at runtime — no network dependency on first launch.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
